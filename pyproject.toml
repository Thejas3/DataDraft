[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "datadraft"
version = "0.1.0"
description = "NFL fantasy trade rulings for Sleeper leagues"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["anthropic>=2.3,<3", "nflreadpy>=0.1.5", "psycopg[binary]>=3.2",
                "fastapi>=0.115", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=9", "hypothesis>=6.170", "import-linter>=2.1", "httpx>=0.27"]

[project.scripts]
datadraft = "datadraft.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# D7: the CLI and the API reach the engine only through datadraft.engine.
[tool.importlinter]
root_package = "datadraft"

[[tool.importlinter.contracts]]
name = "CLI and API use only the engine's public surface"
type = "forbidden"
source_modules = ["datadraft.api", "datadraft.cli"]
forbidden_modules = ["datadraft.projections", "datadraft.scoring", "datadraft.lineup",
                     "datadraft.delta", "datadraft.decide", "datadraft.court",
                     "datadraft.ledger"]
allow_indirect_imports = true
