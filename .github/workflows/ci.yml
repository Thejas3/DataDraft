name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: datadraft, POSTGRES_PASSWORD: datadraft, POSTGRES_DB: datadraft}
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U datadraft" --health-interval 2s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -e '.[dev]'
      - run: lint-imports  # D7: CLI/API only touch datadraft.engine
      - run: pytest -q
  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx next build
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: datadraft, POSTGRES_PASSWORD: datadraft, POSTGRES_DB: datadraft}
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U datadraft" --health-interval 2s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m venv .venv && .venv/bin/pip install -e '.[dev]'
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: playwright-results, path: web/test-results}
