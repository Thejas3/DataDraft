name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: datadraft, POSTGRES_PASSWORD: datadraft, POSTGRES_DB: datadraft}
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U datadraft" --health-interval 2s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -e '.[dev]'
      - run: lint-imports  # D7: CLI/API only touch datadraft.engine
      - run: pytest -q
